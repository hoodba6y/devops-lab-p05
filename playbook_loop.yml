---
- name: NMAP scan (loop variant)
  hosts: scanners
  remote_user: runner
  become: true

  tasks:
  - name: Install NMAP
    ansible.builtin.apt:
      name: nmap
      state: present
      update_cache: true

  - name: Scan
    ansible.builtin.command: "nmap {{ item }} -p 80 -oG -"
    loop: "{{ lookup('file', './targets.txt').splitlines() }}"
    register: scan_results
    changed_when: false

  - name: Scan results
    ansible.builtin.debug:
      msg: "{{ item.stdout_lines }}"
    loop: "{{ scan_results.results }}"
    loop_control:
      label: "{{ item.item }}"
